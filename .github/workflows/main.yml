name: Build Ra_Reader

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    strategy:
      matrix:
        include:
          - arch: x64
            python_arch: x64
            artifact_name: Ra_Reader-Windows-x64

          - arch: x86
            python_arch: x86
            artifact_name: Ra_Reader-Windows-x86

    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}

      - name: Check Python architecture
        shell: cmd
        run: |
          python -c "import struct; print('Python architecture:', struct.calcsize('P') * 8, 'bit')"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: Build EXE
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name "Ra_Reader"
          --icon "icon.ico"
          --add-data "Alice-Regular.ttf;."
          Ra_Reader.pyw

      - name: Upload Windows build
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/Ra_Reader.exe

  build-macos-apple-silicon:
    runs-on: macos-14

    steps:
      - name: Download source
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: arm64

      - name: Check Python architecture
        run: |
          python -c "import platform; print('Python architecture:', platform.machine())"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: Build macOS app
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "Ra_Reader" \
            --icon "icon.icns" \
            --add-data "Alice-Regular.ttf:." \
            Ra_Reader.pyw

      - name: Package macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Ra_Reader.app" \
            "Ra_Reader-macOS-AppleSilicon.zip"

      - name: Upload macOS build
        uses: actions/upload-artifact@v5
        with:
          name: Ra_Reader-macOS-AppleSilicon
          path: Ra_Reader-macOS-AppleSilicon.zip
