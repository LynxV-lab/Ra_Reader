name: Build Ra_Reader

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # ==========================================================
  # Windows x64 / x86
  # ==========================================================

  build-windows:
    strategy:
      matrix:
        include:
          - python_arch: x64
            artifact_name: Ra_Reader-Windows-x64

          - python_arch: x86
            artifact_name: Ra_Reader-Windows-x86

    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}

      - name: Check Python architecture
        shell: cmd
        run: |
          python -c "import struct; print('Python architecture:', struct.calcsize('P') * 8, 'bit')"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: Build EXE
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name "Ra_Reader"
          --icon "icon.ico"
          --add-data "Alice-Regular.ttf;."
          Ra_Reader.pyw

      - name: Prepare distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release/Ra_Reader" | Out-Null

          Copy-Item "dist/Ra_Reader.exe" "release/Ra_Reader/Ra_Reader.exe"

          Copy-Item "0" "release/Ra_Reader/0" -Recurse
          Copy-Item "1" "release/Ra_Reader/1" -Recurse
          Copy-Item "2" "release/Ra_Reader/2" -Recurse
          Copy-Item "3" "release/Ra_Reader/3" -Recurse

          Compress-Archive `
            -Path "release/Ra_Reader" `
            -DestinationPath "release/${{ matrix.artifact_name }}.zip"

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.artifact_name }}.zip


  # ==========================================================
  # macOS — Apple Silicon
  # ==========================================================

  build-macos-apple-silicon:
    runs-on: macos-14

    steps:
      - name: Download source
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: arm64

      - name: Check Python architecture
        run: |
          python -c "import platform; print('Python architecture:', platform.machine())"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: Build macOS app
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "Ra_Reader" \
            --icon "icon.icns" \
            --add-data "Alice-Regular.ttf:." \
            --add-data "0:0" \
            --add-data "1:1" \
            --add-data "2:2" \
            --add-data "3:3" \
            Ra_Reader.pyw

      - name: Package macOS app
        run: |
          mkdir -p release

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "dist/Ra_Reader.app" \
            "release/Ra_Reader-macOS-AppleSilicon.zip"

      - name: Upload macOS distribution
        uses: actions/upload-artifact@v5
        with:
          name: Ra_Reader-macOS-AppleSilicon
          path: release/Ra_Reader-macOS-AppleSilicon.zip


  # ==========================================================
  # Linux x64
  # ==========================================================

  build-linux-x64:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v5

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64

      - name: Check Python architecture
        run: |
          python -c "import platform; print('Python architecture:', platform.machine())"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: Build Linux executable
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name "Ra_Reader" \
            --add-data "Alice-Regular.ttf:." \
            Ra_Reader.pyw

      - name: Prepare Linux distribution
        run: |
          mkdir -p release/Ra_Reader

          cp dist/Ra_Reader release/Ra_Reader/Ra_Reader

          chmod +x release/Ra_Reader/Ra_Reader

          cp -R 0 release/Ra_Reader/0
          cp -R 1 release/Ra_Reader/1
          cp -R 2 release/Ra_Reader/2
          cp -R 3 release/Ra_Reader/3

          cd release

          zip -r \
            Ra_Reader-Linux-x64.zip \
            Ra_Reader

      - name: Upload Linux distribution
        uses: actions/upload-artifact@v5
        with:
          name: Ra_Reader-Linux-x64
          path: release/Ra_Reader-Linux-x64.zip

  # ==========================================================
  # Linux ARM64
  # ==========================================================

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Download source
        uses: actions/checkout@v5

      - name: Check architecture
        run: |
          uname -m

      - name: Install Python and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv python3-tk zip

      - name: Create Python environment
        run: |
          python3 -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install pyinstaller pillow

      - name: Build Linux ARM64 executable
        run: |
          venv/bin/pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name "Ra_Reader" \
            --add-data "Alice-Regular.ttf:." \
            Ra_Reader.pyw

      - name: Prepare Linux ARM64 distribution
        run: |
          mkdir -p release/Ra_Reader

          cp dist/Ra_Reader release/Ra_Reader/Ra_Reader
          chmod +x release/Ra_Reader/Ra_Reader

          cp -R 0 release/Ra_Reader/0
          cp -R 1 release/Ra_Reader/1
          cp -R 2 release/Ra_Reader/2
          cp -R 3 release/Ra_Reader/3

          cd release

          zip -r \
            Ra_Reader-Linux-ARM64.zip \
            Ra_Reader

      - name: Upload Linux ARM64 distribution
        uses: actions/upload-artifact@v5
        with:
          name: Ra_Reader-Linux-ARM64
          path: release/Ra_Reader-Linux-ARM64.zip
